<g opacity="1" clip-path="url(#clip0)"><text x="28" y="66" font-size="14.5" fill="#eaffef">$ php agent.php ask &quot;how do I sort an array?&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.118;0.144;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="90" font-size="14.5" fill="#00ff66">Sorting arrays - sort, rsort, asort, ksort, usort  [Exact match]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.147;0.174;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="114" font-size="14.5" fill="#1f7a44">-------------------------------------------------</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.171;0.197;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="138" font-size="14.5" fill="#8dffb4">Category: Arrays</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.226;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="162" font-size="14.5" fill="#c9f5d6">sort re-indexes and sorts values. asort keeps keys attached to values.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.224;0.250;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="186" font-size="14.5" fill="#c9f5d6">ksort sorts by key. usort sorts with your own comparison function.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.259;0.285;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="210" font-size="14.5" fill="#ffd479">$marks = [85, 92, 78];</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.282;0.309;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="234" font-size="14.5" fill="#ffd479">sort($marks);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.306;0.332;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="258" font-size="14.5" fill="#ffd479">print_r($marks);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.341;0.368;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="282" font-size="14.5" fill="#ffb3b3">Common mistake: sort returns a boolean, not the array.</text></g><g opacity="1" clip-path="url(#clip10)"><text x="28" y="306" font-size="14.5" fill="#eaffef">$ php agent.php fn str_replace</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.518;0.544;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="330" font-size="14.5" fill="#00ff66">str_replace()</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.547;0.574;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="354" font-size="14.5" fill="#c9f5d6">Signature: array|string str_replace(array|string $search,</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.571;0.597;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="378" font-size="14.5" fill="#c9f5d6">    array|string $replace, array|string $subject, &amp;$count = NULL)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.600;0.626;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="402" font-size="14.5" fill="#8dffb4">Extension: standard</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.624;0.650;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="426" font-size="14.5" fill="#7fb8ff">Docs: https://www.php.net/manual/en/function.str-replace.php</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.647;0.674;0.965;1" dur="17.0s" begin="0s" repeatCount="indefinite"/><text x="28" y="450" font-size="14.5" fill="#8dffb4">Verified example: curated entry &quot;string-functions&quot;.</text></g>
